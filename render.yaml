services:
  - type: web
    name: mandateshield-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: JAVA_OPTS
        value: "-XX:+UseSerialGC -Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"
      - key: MONGODB_URI
        sync: false
      - key: MANDATESHIELD_JWT_SECRET
        generateValue: true
